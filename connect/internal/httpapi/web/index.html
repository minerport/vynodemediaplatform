<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>VyNode</title><link rel="stylesheet" href="/style.css"></head><body><main><section class="card auth-card"><div class="mark">V</div><p class="eyebrow">VYNODE MEDIA</p><h1>Welcome to VyNode</h1><p id="lead">Sign in once to find every server linked to your account.</p><form id="auth"><input name="username" autocomplete="username" placeholder="Username" aria-label="Username" required><input name="displayName" autocomplete="name" placeholder="Display name" aria-label="Display name" hidden><input name="password" autocomplete="current-password" type="password" placeholder="Password" aria-label="Password" minlength="12" required><button>Sign In</button></form><button class="link" id="mode">Create Account</button><p class="error" id="error" role="alert"></p></section><section class="card account-card" id="account" hidden><header><div><p class="eyebrow">VYNODE ACCOUNT</p><h1 id="profile"></h1><p id="handle"></p></div><button class="link" id="logout">Sign out</button></header><section class="account-section"><div class="section-heading"><div><p class="eyebrow">YOUR MEDIA SOURCES</p><h2>Linked Servers</h2></div></div><div id="servers"></div><div id="empty"><h2>Your VyNode account is ready.</h2><p>No servers are linked yet. Link your server or accept an invitation to start watching.</p></div><div class="actions"><button id="device">Approve TV code</button><button class="secondary" id="invite">Accept Invitation</button><button class="link">Advanced · Connect manually</button></div><form id="code" hidden><input name="userCode" placeholder="Device code" aria-label="Device code" required><button>Approve</button><button type="button" class="secondary" id="deny">Deny</button></form><form id="invitation" hidden><input name="token" placeholder="Invitation token" aria-label="Invitation token" required><button>Accept and open server</button></form></section><section class="account-section"><p class="eyebrow">SECURITY</p><h2>Devices</h2><div id="devices"></div></section></section></main><script src="/app.js"></script></body></html>

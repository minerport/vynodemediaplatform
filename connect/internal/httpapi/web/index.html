<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>VyNode</title><link rel="stylesheet" href="/style.css"></head><body><main><section class="card"><div class="mark">V</div><p class="eyebrow">VYNODE MEDIA</p><h1>Welcome to VyNode</h1><p id="lead">Sign in once to find every server linked to your account.</p><form id="auth"><input name="username" autocomplete="username" placeholder="Username" required><input name="displayName" autocomplete="name" placeholder="Display name" hidden><input name="password" autocomplete="current-password" type="password" placeholder="Password" minlength="12" required><button>Sign In</button></form><button class="link" id="mode">Create Account</button><p class="error" id="error"></p></section><section class="card" id="account" hidden><header><div><p class="eyebrow">VYNODE ACCOUNT</p><h1 id="profile"></h1></div><button class="link" id="logout">Sign out</button></header><h2>Linked Servers</h2><div id="servers"></div><p id="empty">No VyNode servers are linked to your account yet.</p><div class="actions"><button id="device">Approve TV code</button><button class="secondary" id="invite">Accept Invitation</button><button class="link">Advanced · Connect manually</button></div><form id="code" hidden><input name="userCode" placeholder="Device code" required><button>Approve</button><button type="button" class="secondary" id="deny">Deny</button></form><form id="invitation" hidden><input name="token" placeholder="Invitation token" required><button>Accept and open server</button></form><h2>VyNode Account Devices</h2><div id="devices"></div></section></main><script src="/app.js"></script></body></html>

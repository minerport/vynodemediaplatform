components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    BadRequest: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Authentication failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: State conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    LibraryId: { name: libraryId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    PlaybackSessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    LogicalType: { name: logicalType, in: path, required: true, schema: { type: string, enum: [MOVIE, EPISODE] } }
    LogicalId: { name: logicalId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    DownloadRequest:
      type: object
      required: [logicalType, logicalId, profileId]
      properties:
        logicalType: { type: string, enum: [MOVIE, EPISODE] }
        logicalId: { type: string }
        profileId: { type: string, enum: [ORIGINAL, HIGH, MEDIUM, LOW] }
    PlaybackStart:
      type: object
      required: [logicalType, logicalId, resume, capabilities]
      properties:
        logicalType: { type: string, enum: [MOVIE, EPISODE] }
        logicalId: { type: string, format: uuid }
        requestedVersionId: { type: string, format: uuid }
        selectedAudioTrackId: { type: string }
        selectedSubtitleTrackId: { type: string }
        resume: { type: boolean }
        capabilities: { $ref: '#/components/schemas/ClientCapabilities' }
    ClientCapabilities:
      type: object
      required: [schemaVersion, clientName, platform, supportedContainers, supportedVideoCodecs, supportedAudioCodecs, directPlaySupport]
      properties:
        schemaVersion: { type: integer, enum: [1, 2] }
        clientName: { type: string }
        clientVersion: { type: string }
        platform: { type: string }
        platformVersion: { type: string }
        deviceModel: { type: string }
        supportedContainers: { type: array, maxItems: 20, items: { type: string } }
        supportedVideoCodecs: { type: array, maxItems: 20, items: { type: string } }
        supportedAudioCodecs: { type: array, maxItems: 30, items: { type: string } }
        subtitleFormats: { type: array, items: { type: string } }
        maximumVideoWidth: { type: integer, minimum: 0 }
        maximumVideoHeight: { type: integer, minimum: 0 }
        maximumAudioChannels: { type: integer, minimum: 0, maximum: 16 }
        fragmentedMp4Support: { type: boolean }
        hdrCapabilities: { type: array, items: { type: string } }
        directPlaySupport: { type: boolean }
    LibraryCreate:
      type: object
      required: [name, type]
      properties: { name: { type: string, minLength: 1, maxLength: 100 }, type: { type: string, enum: [MOVIES, TV] }, enabled: { type: boolean, default: true }, sources: { type: array, items: { type: string } } }
    OwnerSetup:
      type: object
      required: [username, displayName, password]
      properties: { username: { type: string, minLength: 3, maxLength: 64 }, displayName: { type: string, minLength: 1, maxLength: 100 }, password: { type: string, minLength: 10, maxLength: 256, writeOnly: true }, serverName: { type: string, maxLength: 100 }, device: { type: object } }
    Login:
      type: object
      required: [username, password]
      properties: { username: { type: string }, password: { type: string, writeOnly: true }, device: { type: object } }
    Probe:
      type: object
      required: [status]
      properties: { status: { type: string } }
    SystemVersion:
      type: object
      required: [version, commit, apiVersion]
      properties: { version: { type: string }, commit: { type: string }, apiVersion: { type: string, const: v1 } }
    SystemInfo:
      type: object
      required: [version, operatingSystem, architecture, instanceId, serverName, databaseType, uptimeSeconds]
      properties:
        version: { type: string }
        operatingSystem: { type: string }
        architecture: { type: string }
        instanceId: { type: string, format: uuid }
        serverName: { type: string }
        databaseType: { type: string, enum: [sqlite] }
        uptimeSeconds: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties: { code: { type: string }, message: { type: string }, requestId: { type: string } }

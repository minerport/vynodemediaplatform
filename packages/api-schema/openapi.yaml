openapi: 3.1.0
info: { title: VyNode Media API, version: 0.1.0, description: Versioned client contract. Breaking changes require a new /api/vN namespace. }
servers: [{ url: / }]
paths:
  /health:
    get:
      operationId: getHealth
      responses: { '200': { description: Process is alive, content: { application/json: { schema: { $ref: '#/components/schemas/Probe' } } } } }
  /ready:
    get:
      operationId: getReadiness
      responses:
        '200': { description: Dependencies are ready, content: { application/json: { schema: { $ref: '#/components/schemas/Probe' } } } }
        '503': { description: Dependency unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/system/version:
    get:
      operationId: getSystemVersion
      responses: { '200': { description: Build and API version, content: { application/json: { schema: { $ref: '#/components/schemas/SystemVersion' } } } } }
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      responses: { '200': { description: Safe server information, content: { application/json: { schema: { $ref: '#/components/schemas/SystemInfo' } } } } }
  /api/v1/setup/status:
    get: { operationId: getSetupStatus, responses: { '200': { description: Persistent setup state } } }
  /api/v1/setup/owner:
    post: { operationId: createOwner, summary: Available only while setup is required, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSetup' } } } }, responses: { '201': { description: Owner and browser session created }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/v1/auth/login:
    post: { operationId: login, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } } }, responses: { '200': { description: Access token returned and HttpOnly refresh cookie set }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /api/v1/auth/refresh:
    post: { operationId: refreshSession, summary: Rotates cookie or native refresh credential, responses: { '200': { description: Rotated session credentials }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /api/v1/auth/logout:
    post: { operationId: logout, security: [{ bearerAuth: [] }], responses: { '204': { description: Current session revoked } } }
  /api/v1/auth/logout-others:
    post: { operationId: logoutOthers, security: [{ bearerAuth: [] }], responses: { '204': { description: Other sessions revoked } } }
  /api/v1/account/me:
    get: { operationId: getCurrentAccount, security: [{ bearerAuth: [] }], responses: { '200': { description: Current safe account profile } } }
  /api/v1/account/sessions:
    get: { operationId: listSessions, security: [{ bearerAuth: [] }], responses: { '200': { description: Active devices and sessions; no credentials } } }
  /api/v1/account/sessions/{sessionId}:
    delete: { operationId: revokeSession, security: [{ bearerAuth: [] }], parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Session revoked } } }
  /api/v1/account/password:
    post: { operationId: changePassword, security: [{ bearerAuth: [] }], responses: { '204': { description: Password changed and other sessions revoked } } }
  /api/v1/admin/users:
    get: { operationId: listUsers, summary: Requires users.manage, security: [{ bearerAuth: [] }], responses: { '200': { description: Safe user list } } }
    post: { operationId: createUser, summary: Requires users.manage; ADMIN or USER only, security: [{ bearerAuth: [] }], responses: { '201': { description: Account created } } }
  /api/v1/admin/users/{id}:
    get: { operationId: getUser, summary: Requires users.manage, security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Safe account detail } } }
    patch: { operationId: setUserEnabled, summary: Requires users.manage; OWNER cannot be changed, security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Status updated; disable revokes sessions } } }
  /api/v1/admin/audit:
    get: { operationId: listAuditEvents, summary: Requires audit.view, security: [{ bearerAuth: [] }], parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }, { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }], responses: { '200': { description: Newest-first audit page } } }
  /api/v1/libraries:
    get: { operationId: listLibraries, summary: Requires libraries.view, security: [{ bearerAuth: [] }], responses: { '200': { description: Physical media libraries and inventory counts } } }
    post: { operationId: createLibrary, summary: Requires libraries.manage, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryCreate' } } } }, responses: { '201': { description: Library and validated sources created }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /api/v1/libraries/sources/validate:
    post: { operationId: validateLibrarySource, summary: Requires libraries.manage; validates a server-visible absolute directory without exposing a filesystem browser, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [path], properties: { path: { type: string }, libraryId: { type: string, format: uuid } } } } } }, responses: { '200': { description: Existing readable non-forbidden directory }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /api/v1/libraries/{libraryId}:
    parameters: [{ $ref: '#/components/parameters/LibraryId' }]
    get: { operationId: getLibrary, summary: Requires libraries.view, security: [{ bearerAuth: [] }], responses: { '200': { description: Library and configured sources }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { operationId: updateLibrary, summary: Requires libraries.manage, security: [{ bearerAuth: [] }], responses: { '200': { description: Library updated } } }
    delete: { operationId: deleteLibrary, summary: Requires libraries.manage; removes inventory only and never modifies media files, security: [{ bearerAuth: [] }], responses: { '204': { description: Library inventory removed; filesystem untouched } } }
  /api/v1/libraries/{libraryId}/sources:
    post: { operationId: addLibrarySource, summary: Requires libraries.manage, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LibraryId' }], responses: { '201': { description: Validated source added } } }
  /api/v1/libraries/{libraryId}/sources/{sourceId}:
    delete: { operationId: removeLibrarySource, summary: Requires libraries.manage; filesystem untouched, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LibraryId' }, { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Source inventory removed } } }
  /api/v1/libraries/{libraryId}/scan:
    post: { operationId: startLibraryScan, summary: Requires libraries.scan; duplicate active scan returns 409, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LibraryId' }], responses: { '202': { description: Background scan queued }, '409': { $ref: '#/components/responses/Conflict' }, '503': { description: FFprobe unavailable } } }
  /api/v1/libraries/{libraryId}/scans/{jobId}:
    get: { operationId: getLibraryScan, summary: Requires libraries.scan, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LibraryId' }, { $ref: '#/components/parameters/JobId' }], responses: { '200': { description: Persisted scan state and counters } } }
    delete: { operationId: cancelLibraryScan, summary: Requires libraries.scan, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LibraryId' }, { $ref: '#/components/parameters/JobId' }], responses: { '204': { description: Cancellation signaled } } }
  /api/v1/libraries/{libraryId}/items:
    get: { operationId: listPhysicalMedia, summary: Requires media.inventory.view, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LibraryId' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }, { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }], responses: { '200': { description: Deterministically relative-path-sorted physical inventory page } } }
  /api/v1/media/files/{fileId}:
    get: { operationId: getPhysicalMediaFile, summary: Requires media.inventory.view, security: [{ bearerAuth: [] }], parameters: [{ name: fileId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: "Physical file, technical probe data, normalized streams, and preliminary filename hints" } } }
  /api/v1/admin/system/media-probe:
    get: { operationId: getMediaProbeCapability, summary: Requires security.view, security: [{ bearerAuth: [] }], responses: { '200': { description: Safe FFprobe availability and version } } }
  /api/v1/movies:
    get: { operationId: listMovies, summary: Requires logical.media.view; local and offline, security: [{ bearerAuth: [] }], responses: { '200': { description: Identified logical movie page } } }
  /api/v1/movies/{id}:
    get: { operationId: getMovie, summary: Requires logical.media.view; paths are excluded, security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Movie metadata and safe physical version labels } } }
  /api/v1/movies/{id}/refresh:
    post: { operationId: refreshMovieMetadata, summary: Requires metadata.manage; preserves association and manual artwork, security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Movie provider fields refreshed } } }
  /api/v1/shows:
    get: { operationId: listShows, summary: Requires logical.media.view; local and offline, security: [{ bearerAuth: [] }], responses: { '200': { description: Identified logical show page } } }
  /api/v1/shows/{id}:
    get: { operationId: getShow, summary: Requires logical.media.view, security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: "Show, seasons, episodes, and availability" } } }
  /api/v1/shows/{id}/refresh:
    post: { operationId: refreshShowMetadata, summary: Requires metadata.manage; preserves association and manual artwork, security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Show provider fields refreshed } } }
  /api/v1/search:
    get: { operationId: searchLocalMedia, summary: Local logical-title search; no provider dependency, security: [{ bearerAuth: [] }], parameters: [{ name: q, in: query, schema: { type: string } }], responses: { '200': { description: Matching local movies and shows } } }
  /api/v1/admin/metadata/provider:
    get: { operationId: getMetadataProviderStatus, summary: Requires metadata.provider.manage; secret is never returned, security: [{ bearerAuth: [] }], responses: { '200': { description: TMDb configuration status } } }
    put: { operationId: configureMetadataProvider, summary: Requires metadata.provider.manage, security: [{ bearerAuth: [] }], responses: { '200': { description: Configuration stored under application config } } }
  /api/v1/admin/metadata/provider/test:
    post: { operationId: testMetadataProvider, summary: Requires metadata.provider.manage, security: [{ bearerAuth: [] }], responses: { '200': { description: Credential and connectivity accepted }, '503': { description: Provider unavailable } } }
  /api/v1/admin/metadata/provider/search:
    get: { operationId: searchMetadataProvider, summary: Requires metadata.manage; distinct from local search, security: [{ bearerAuth: [] }], responses: { '200': { description: Normalized provider candidates } } }
  /api/v1/admin/metadata/unmatched:
    get: { operationId: listUnmatchedMedia, summary: Requires metadata.manage; includes physical names only for administrators, security: [{ bearerAuth: [] }], responses: { '200': { description: Review queue with diagnostics } } }
  /api/v1/admin/metadata/files/{fileId}/match:
    post: { operationId: manuallyMatchMedia, summary: Requires metadata.manage; supports movie and multi-episode TV association, security: [{ bearerAuth: [] }], parameters: [{ name: fileId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Logical association created or reused } } }
  /api/v1/admin/metadata/files/{fileId}/unmatch:
    post: { operationId: unmatchMedia, summary: Requires metadata.manage; physical inventory and user file remain unchanged, security: [{ bearerAuth: [] }], parameters: [{ name: fileId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Association removed and orphan retained } } }
  /api/v1/libraries/{libraryId}/identify:
    post: { operationId: identifyLibrary, summary: Requires metadata.manage; queues an explicit background identification stage, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LibraryId' }], responses: { '202': { description: Metadata job queued }, '409': { description: An active job already exists; response includes that job } } }
  /api/v1/libraries/{libraryId}/metadata-jobs/{jobId}:
    get: { operationId: getMetadataJob, summary: Requires metadata.manage, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LibraryId' }, { $ref: '#/components/parameters/JobId' }], responses: { '200': { description: Identification counters and state } } }
  /api/v1/movies/{id}/artwork:
    get: { operationId: listMovieArtwork, summary: Lists movie artwork without exposing cache paths, security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Artwork candidates and selection state } } }
  /api/v1/movies/{id}/artwork/{artworkId}/select:
    post: { operationId: selectMovieArtwork, summary: Requires metadata.manage; caches selection and preserves it across refresh, security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: artworkId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Artwork selected and cached } } }
  /api/v1/shows/{id}/artwork:
    get: { operationId: listShowArtwork, summary: Lists show artwork without exposing cache paths, security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Artwork candidates and selection state } } }
  /api/v1/shows/{id}/artwork/{artworkId}/select:
    post: { operationId: selectShowArtwork, summary: Requires metadata.manage; caches selection and preserves it across refresh, security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: artworkId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Artwork selected and cached } } }
  /api/v1/artwork/{artworkId}/content:
    get: { operationId: getArtworkContent, summary: Streams a controlled cached image with ETag, security: [{ bearerAuth: [] }], parameters: [{ name: artworkId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Cached image bytes }, '304': { description: Not modified } } }
  /api/v1/playback/sessions:
    post: { operationId: createPlaybackSession, summary: "Selects the least-cost valid mode through authenticated HLS video transcode and returns an explainable quality/backend plan", security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlaybackStart' } } } }, responses: { '201': { description: Persistent playback session and structured decision }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { description: Playback denied }, '503': { description: Transcode capacity reached } } }
  /api/v1/playback/sessions/{sessionId}:
    patch: { operationId: updatePlaybackSession, summary: Owner-only progress/state update, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/PlaybackSessionId' }], responses: { '204': { description: Progress persisted }, '403': { description: Not session owner } } }
    delete: { operationId: stopPlaybackSession, summary: Stops current user's playback session, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/PlaybackSessionId' }], responses: { '204': { description: Session stopped }, '403': { description: Not session owner } } }
  /api/v1/playback/sessions/{sessionId}/media:
    get: { operationId: deliverPlaybackMedia, summary: Authorized original bytes with Range or progressive generated fMP4 with validated start seconds, parameters: [{ $ref: '#/components/parameters/PlaybackSessionId' }, { name: Range, in: header, schema: { type: string } }, { name: start, in: query, schema: { type: number, minimum: 0, maximum: 604800 } }], responses: { '200': { description: Original or generated stream }, '206': { description: Direct Play byte range }, '403': { description: Invalid playback authorization }, '410': { description: Playback session ended }, '416': { description: "Invalid range or Range on generated media" }, '503': { description: Pipeline capacity reached or FFmpeg unavailable } } }
    head: { operationId: headPlaybackMedia, summary: Original media headers without body, parameters: [{ $ref: '#/components/parameters/PlaybackSessionId' }, { name: Range, in: header, schema: { type: string } }], responses: { '200': { description: Full media headers }, '206': { description: Range headers }, '416': { description: Invalid range } } }
  /api/v1/playback/sessions/{sessionId}/hls/{file}:
    get: { operationId: deliverPlaybackHlsResource, summary: "Session-authorized private HLS playlist, initialization fragment, or segment without exposing filesystem paths", parameters: [{ $ref: '#/components/parameters/PlaybackSessionId' }, { name: file, in: path, required: true, schema: { type: string, pattern: '^(master\\.m3u8|init\\.mp4|segment-[0-9]{6}\\.m4s)$' } }], responses: { '200': { description: Authorized HLS resource }, '403': { description: "Cross-user, expired, or invalid resource denied" }, '410': { description: Playback session ended }, '503': { description: Video transcode capacity reached } } }
  /api/v1/playback/{logicalType}/{logicalId}/versions:
    get: { operationId: listPlaybackVersions, summary: Safe technical versions without paths, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LogicalType' }, { $ref: '#/components/parameters/LogicalId' }], responses: { '200': { description: Available versions }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/playback/sessions/{sessionId}/subtitles/{trackId}:
    get: { operationId: deliverPlaybackSubtitle, summary: Session-authorized sanitized WebVTT, parameters: [{ $ref: '#/components/parameters/PlaybackSessionId' }, { name: trackId, in: path, required: true, schema: { type: string } }], responses: { '200': { description: WebVTT subtitle, content: { text/vtt: {} } }, '403': { description: Invalid playback authorization } } }
  /api/v1/playback/continue-watching:
    get: { operationId: continueWatching, summary: Current user's incomplete local progress, security: [{ bearerAuth: [] }], responses: { '200': { description: Partially watched movies and episodes }, '403': { description: Denied } } }
  /api/v1/playback/continue-watching/items/{logicalType}/{logicalId}:
    delete: { operationId: dismissContinueWatching, summary: Hides an item until that user plays it again without changing watched state, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LogicalType' }, { $ref: '#/components/parameters/LogicalId' }], responses: { '204': { description: Item dismissed }, '403': { description: Denied } } }
  /api/v1/account/playback-preferences:
    get: { operationId: getPlaybackPreferences, summary: Current user's semantic audio subtitle autoplay and quality defaults, security: [{ bearerAuth: [] }], responses: { '200': { description: Playback preferences }, '403': { description: Denied } } }
    patch: { operationId: updatePlaybackPreferences, summary: Replaces validated preferences for the authenticated user only, security: [{ bearerAuth: [] }], responses: { '200': { description: Updated playback preferences }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /api/v1/playback/{logicalType}/{logicalId}/markers:
    get: { operationId: listMediaMarkers, summary: Returns logical-timeline skip markers without paths, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LogicalType' }, { $ref: '#/components/parameters/LogicalId' }], responses: { '200': { description: Manual marker ranges }, '403': { description: Denied } } }
  /api/v1/playback/{logicalType}/{logicalId}/start-over:
    post: { operationId: resetPlaybackProgress, summary: Resets resume position without conflating dismissal or watched state, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LogicalType' }, { $ref: '#/components/parameters/LogicalId' }], responses: { '204': { description: Resume progress reset }, '403': { description: Denied } } }
  /api/v1/admin/media-markers:
    post: { operationId: createMediaMarker, summary: OWNER or ADMIN creates a validated manual logical-timeline marker and audit event, security: [{ bearerAuth: [] }], responses: { '201': { description: Marker created }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { description: Denied } } }
  /api/v1/admin/media-markers/{markerId}:
    patch: { operationId: updateMediaMarker, summary: OWNER or ADMIN updates a manual marker and audits the change, security: [{ bearerAuth: [] }], parameters: [{ name: markerId, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Marker updated }, '403': { description: Denied } } }
    delete: { operationId: deleteMediaMarker, summary: OWNER or ADMIN deletes a marker and audits the change, security: [{ bearerAuth: [] }], parameters: [{ name: markerId, in: path, required: true, schema: { type: string } }], responses: { '204': { description: Marker deleted }, '403': { description: Denied } } }
  /api/v1/playback/{logicalType}/{logicalId}/progress:
    get: { operationId: getPlaybackProgress, summary: Current user's private logical-media progress, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LogicalType' }, { $ref: '#/components/parameters/LogicalId' }], responses: { '200': { description: Progress or empty initial state }, '403': { description: Denied } } }
  /api/v1/playback/{logicalType}/{logicalId}/watched:
    put: { operationId: setWatchedState, summary: Marks current user's item watched or unwatched, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/LogicalType' }, { $ref: '#/components/parameters/LogicalId' }], responses: { '204': { description: Watch state updated }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /api/v1/admin/playback/sessions:
    get: { operationId: listActivePlaybackSessions, summary: Requires playback.sessions.view; no paths, security: [{ bearerAuth: [] }], responses: { '200': { description: Active streams }, '403': { description: Denied } } }
  /api/v1/admin/playback/capabilities:
    get: { operationId: getPlaybackCapabilities, summary: Safe FFmpeg capabilities and pipeline counts, security: [{ bearerAuth: [] }], responses: { '200': { description: FFmpeg version and relevant capabilities }, '403': { description: Denied } } }
  /api/v1/admin/playback/sessions/{sessionId}:
    delete: { operationId: terminatePlaybackSession, summary: Requires playback.sessions.manage and emits a security audit event, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/PlaybackSessionId' }], responses: { '204': { description: Session terminated }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/admin/background-jobs:
    get: { operationId: listBackgroundJobs, summary: Unified marker-analysis and optimization job history, security: [{ bearerAuth: [] }], responses: { '200': { description: Background work ordered newest first }, '403': { description: Denied } } }
  /api/v1/admin/background-jobs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete: { operationId: cancelBackgroundJob, summary: Cancels queued or running controlled work, security: [{ bearerAuth: [] }], responses: { '204': { description: Cancellation requested }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/admin/marker-analysis:
    post: { operationId: startMarkerAnalysis, summary: Queues local-only bounded fingerprint and credits analysis, security: [{ bearerAuth: [] }], responses: { '202': { description: Deduplicated background job }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /api/v1/admin/marker-review:
    get: { operationId: listMarkerReviewCandidates, summary: Medium-confidence and conflicting automatic candidates, security: [{ bearerAuth: [] }], responses: { '200': { description: Review queue }, '403': { description: Denied } } }
  /api/v1/admin/marker-review/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { operationId: reviewAutomaticMarker, summary: Accept adjust or reject with durable suppression and manual precedence, security: [{ bearerAuth: [] }], responses: { '204': { description: Review persisted }, '409': { description: Manual marker remains authoritative } } }
  /api/v1/admin/marker-policy:
    get: { operationId: getAutomaticMarkerPolicy, security: [{ bearerAuth: [] }], responses: { '200': { description: Explicit activation policy }, '403': { description: Denied } } }
    put: { operationId: setAutomaticMarkerPolicy, security: [{ bearerAuth: [] }], responses: { '204': { description: Policy saved and audited }, '403': { description: Denied } } }
  /api/v1/admin/optimizations:
    get: { operationId: listOptimizedVersions, summary: Lists VyNode-managed derivatives without filesystem paths, security: [{ bearerAuth: [] }], responses: { '200': { description: Managed optimized versions }, '403': { description: Denied } } }
    post: { operationId: createOptimizedVersion, summary: Queues an atomic derivative under controlled storage without modifying the original, security: [{ bearerAuth: [] }], responses: { '202': { description: Optimization job }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /api/v1/admin/optimizations/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete: { operationId: deleteOptimizedVersion, summary: Removes only the managed derivative and its catalog records; original media is untouched, security: [{ bearerAuth: [] }], responses: { '204': { description: Derivative removed }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/admin/automation-rules:
    get: { operationId: listAutomationRules, security: [{ bearerAuth: [] }], responses: { '200': { description: Structured allowlisted rules }, '403': { description: Denied } } }
    post: { operationId: createAutomationRule, security: [{ bearerAuth: [] }], responses: { '200': { description: Rule saved and audited }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /api/v1/admin/automation-rules/dry-run:
